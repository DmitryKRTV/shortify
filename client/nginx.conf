server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://server:8080;
    }

    location /auth/ {
        proxy_pass http://server:8080;
    }

    location ~ "^/[A-Za-z0-9]{8}$" {
        proxy_pass http://server:8080;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
